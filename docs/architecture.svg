<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5D5D66"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0066FA"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="32" y="42" font-size="22" font-weight="600" fill="#18181B">WalletDesk</text>
    <text x="32" y="68" font-size="13" fill="#5D5D66">Idle wallet inventory backs a Uniswap v4 pool. Overflow fills from the best Aqua desk, guarded by the pool spot and a Chainlink CRE reference.</text>

    <!-- Unichain panel -->
    <rect x="24" y="92" width="800" height="512" rx="12" fill="#F2F2F3"/>
    <text x="44" y="120" font-size="13" font-weight="600" fill="#18181B">Unichain (live contracts, or a local fork)</text>

    <rect x="48" y="144" width="180" height="60" rx="10" fill="#ffffff" stroke="#0066FA"/>
    <text x="68" y="170" font-size="13" fill="#18181B">Maker wallet</text>
    <text x="68" y="188" font-size="11" fill="#5D5D66">tokens never deposited</text>

    <rect x="312" y="144" width="190" height="60" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.15)"/>
    <text x="332" y="170" font-size="13" fill="#18181B">1inch Aqua registry</text>
    <text x="332" y="188" font-size="11" fill="#5D5D66">virtual balances</text>

    <rect x="580" y="144" width="220" height="60" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.15)"/>
    <text x="600" y="170" font-size="13" fill="#18181B">WalletDeskRouter</text>
    <text x="600" y="188" font-size="11" fill="#5D5D66">SwapVM + DeskBand opcode</text>

    <rect x="292" y="300" width="230" height="84" rx="10" fill="#ffffff" stroke="#0066FA" stroke-width="1.5"/>
    <text x="312" y="326" font-size="13" font-weight="600" fill="#18181B">OverflowHook</text>
    <text x="312" y="346" font-size="11" fill="#5D5D66">desk registry (8 per pool)</text>
    <text x="312" y="362" font-size="11" fill="#5D5D66">guards: spot · CRE ref · funded</text>
    <text x="312" y="378" font-size="11" fill="#5D5D66">skip, never revert</text>

    <rect x="580" y="300" width="220" height="84" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.15)"/>
    <text x="600" y="330" font-size="13" fill="#18181B">v4 PoolManager</text>
    <text x="600" y="350" font-size="11" fill="#5D5D66">pool fills up to the cap</text>

    <rect x="580" y="480" width="220" height="64" rx="10" fill="#0066FA"/>
    <text x="600" y="508" font-size="13" fill="#ffffff">Any v4 router</text>
    <text x="600" y="526" font-size="11" fill="#DCE9FF">OverflowRouter, PoolSwapTest, …</text>

    <rect x="48" y="480" width="200" height="64" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.15)"/>
    <text x="68" y="508" font-size="13" fill="#18181B">DeskPriceFeed</text>
    <text x="68" y="526" font-size="11" fill="#5D5D66">CRE consumer (onReport)</text>

    <!-- arrows inside Unichain -->
    <line x1="228" y1="174" x2="308" y2="174" stroke="#5D5D66" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="238" y="164" font-size="11" fill="#5D5D66">ship</text>
    <line x1="502" y1="174" x2="576" y2="174" stroke="#5D5D66" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="508" y="164" font-size="11" fill="#5D5D66">pull/push</text>
    <path d="M 138 204 V 250 H 410 V 208" fill="none" stroke="#5D5D66" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="150" y="244" font-size="11" fill="#5D5D66">transferFrom on fill only</text>
    <line x1="690" y1="480" x2="690" y2="388" stroke="#0066FA" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="698" y="440" font-size="11" fill="#0066FA">exact-input swap</text>
    <line x1="580" y1="342" x2="526" y2="342" stroke="#5D5D66" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="528" y="334" font-size="11" fill="#5D5D66">beforeSwap</text>
    <line x1="470" y1="300" x2="640" y2="208" stroke="#5D5D66" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="540" y="244" font-size="11" fill="#5D5D66">fill residual</text>
    <line x1="200" y1="480" x2="320" y2="388" stroke="#5D5D66" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="120" y="440" font-size="11" fill="#5D5D66">reference price</text>

    <!-- Chainlink CRE panel -->
    <rect x="848" y="92" width="328" height="300" rx="12" fill="#ffffff" stroke="#0066FA"/>
    <text x="868" y="120" font-size="13" font-weight="600" fill="#18181B">Chainlink CRE: desk-guard</text>
    <rect x="868" y="138" width="288" height="44" rx="8" fill="#F2F2F3"/>
    <text x="884" y="165" font-size="12" fill="#18181B">cron every 30 s</text>
    <rect x="868" y="196" width="288" height="44" rx="8" fill="#F2F2F3"/>
    <text x="884" y="223" font-size="12" fill="#18181B">HTTP: Coinbase + Kraken (each node)</text>
    <rect x="868" y="254" width="288" height="44" rx="8" fill="#F2F2F3"/>
    <text x="884" y="281" font-size="12" fill="#18181B">DON consensus median, sanity band</text>
    <rect x="868" y="312" width="288" height="44" rx="8" fill="#F2F2F3"/>
    <text x="884" y="339" font-size="12" fill="#18181B">report → forwarder → onReport</text>
    <path d="M 860 372 V 630 H 148 V 548" fill="none" stroke="#0066FA" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="420" y="622" font-size="11" fill="#0066FA">abi.encode(poolId, priceX18, observedAt)</text>

    <!-- Rebates panel -->
    <rect x="884" y="420" width="292" height="150" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-dasharray="5 4"/>
    <text x="904" y="448" font-size="13" font-weight="600" fill="#18181B">Optional: USDC rebates</text>
    <text x="904" y="472" font-size="11" fill="#5D5D66">FeeShareTreasury, protocol-funded,</text>
    <text x="904" y="490" font-size="11" fill="#5D5D66">credited per fill id, optional split.</text>
    <text x="904" y="514" font-size="11" fill="#5D5D66">CCTP V2 Unichain Sepolia → Arc (26).</text>
    <text x="904" y="538" font-size="11" fill="#5D5D66">The maker spread itself stays in</text>
    <text x="904" y="556" font-size="11" fill="#5D5D66">the maker wallet.</text>
  </g>
</svg>

name: ci

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Local tests
        run: forge test --no-match-contract OverflowForkTest --summary
      - name: Unichain fork tests
        # The public RPC is load balanced. The suite already forks 10 blocks behind head; retry covers the rest.
        run: |
          for attempt in 1 2 3; do
            forge test --match-contract OverflowForkTest --summary && exit 0
            echo "fork attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
      - name: Contract sizes
        run: forge build --sizes --skip test --skip script

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keeper unit tests
        run: node --test services/keeper/scale.test.mjs services/keeper/reference.test.mjs
      - name: Treasury source matches the Arc paste file
        run: cmp contracts/src/FeeShareTreasury.sol arc/FeeShareTreasury.sol

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

name: ci

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Local tests
        run: forge test --no-match-contract OverflowForkTest --summary
      - name: Unichain fork tests
        run: forge test --match-contract OverflowForkTest --summary

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keeper unit tests
        run: node --test services/keeper/scale.test.mjs
      - name: Treasury source matches the Arc paste file
        run: cmp contracts/src/FeeShareTreasury.sol arc/FeeShareTreasury.sol

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
